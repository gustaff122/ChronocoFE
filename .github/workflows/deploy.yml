name: Docker Build & Deploy ChronocoFE

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t priv:chronoco .
          docker tag priv:chronoco ${{ secrets.DOCKER_USERNAME }}/priv:chronoco

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/priv:chronoco

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: SSH to host and deploy ChronocoFE
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.HOST_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/priv:chronoco
            docker stop chronoco-frontend || true
            docker rm chronoco-frontend || true
            docker run -d --name chronoco-frontend -p 1404:1404 ${{ secrets.DOCKER_USERNAME }}/priv:chronoco