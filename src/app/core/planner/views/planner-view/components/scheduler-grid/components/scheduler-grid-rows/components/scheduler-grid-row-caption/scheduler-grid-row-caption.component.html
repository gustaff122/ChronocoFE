<div class="w-16 relative" [style.height.px]="isLast() ? SCHEDULER_HOUR_CAPTION_HEIGHT : (time() | appSchedulerHourHeight : timeFrom() : timeTo())">
  <span class="absolute top-0 text-gray-500 text-sm -translate-y-1/2">
    {{ time() }}
  </span>

  <div class="{{ (time() === '00:00' && !isFirst()) ? 'bg-blue-300' : 'bg-gray-100' }} w-5 h-0.5 absolute top-0 right-0">
  </div>

  @if (!isLast()) {
    <div class="absolute top-1/2 -translate-y-1/2">
    <span class="text-gray-400 text-xs">
        {{ time().slice(0, 2) + ':30' }}
    </span>

      <div class="w-6 h-0.5 bg-gray-100 absolute top-1/2 -right-9">
      </div>
    </div>
  }
</div>
